<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JMDReader Interactive JSON Tree Viewer</title>
    <style>
        :root {
            --bg-color: #ffffff;
            --text-color: #1f2328;
            --border-color: #d0d7de;
            --toolbar-bg: rgba(246, 248, 250, 0.92);
            --badge-bg: #eaeef2;
            --badge-text: #57606a;
            --hover-bg: rgba(0, 0, 0, 0.04);
            --key-color: #0969da;
            --string-color: #0a8543;
            --number-color: #953800;
            --boolean-color: #8250df;
            --null-color: #6e7781;
            --highlight-bg: #fff8c5;
            --highlight-active: #ff9800;
            --highlight-active-text: #ffffff;
            --input-bg: #ffffff;
            --pill-shadow: 0 1px 2px rgba(0,0,0,0.06);
        }

        body[data-theme="dark"] {
            --bg-color: #0d1117;
            --text-color: #e6edf3;
            --border-color: #30363d;
            --toolbar-bg: rgba(22, 27, 34, 0.92);
            --badge-bg: #21262d;
            --badge-text: #8b949e;
            --hover-bg: rgba(255, 255, 255, 0.06);
            --key-color: #79c0ff;
            --string-color: #7ee787;
            --number-color: #ffa657;
            --boolean-color: #d2a8ff;
            --null-color: #8b949e;
            --highlight-bg: #383200;
            --highlight-active: #ff9800;
            --highlight-active-text: #000000;
            --input-bg: #0d1117;
            --pill-shadow: 0 1px 2px rgba(0,0,0,0.3);
        }

        body[data-theme="darkslate"], body[data-theme="dark_slate"] {
            --bg-color: #1e2227;
            --text-color: #abb2bf;
            --border-color: #282c34;
            --toolbar-bg: rgba(33, 37, 43, 0.92);
            --badge-bg: #282c34;
            --badge-text: #828997;
            --hover-bg: rgba(255, 255, 255, 0.05);
            --key-color: #61afef;
            --string-color: #98c379;
            --number-color: #d19a66;
            --boolean-color: #c678dd;
            --null-color: #5c6370;
            --highlight-bg: #3e4451;
            --highlight-active: #e5c07b;
            --highlight-active-text: #1e2227;
            --input-bg: #1e2227;
            --pill-shadow: 0 1px 2px rgba(0,0,0,0.3);
        }

        body[data-theme="sepia"] {
            --bg-color: #fbf0d9;
            --text-color: #433422;
            --border-color: #e2d3b5;
            --toolbar-bg: rgba(243, 229, 200, 0.92);
            --badge-bg: #ebdac0;
            --badge-text: #6b583f;
            --hover-bg: rgba(100, 70, 30, 0.07);
            --key-color: #2b6cb0;
            --string-color: #2e7d32;
            --number-color: #d97706;
            --boolean-color: #7c3aed;
            --null-color: #78716c;
            --highlight-bg: #fef08a;
            --highlight-active: #ea580c;
            --highlight-active-text: #ffffff;
            --input-bg: #fbf0d9;
            --pill-shadow: 0 1px 2px rgba(0,0,0,0.06);
        }

        * {
            box-sizing: border-box;
            user-select: text;
            -webkit-user-select: text;
        }

        body {
            margin: 0;
            padding: 0;
            background-color: var(--bg-color);
            color: var(--text-color);
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI Variable", "Segoe UI", Cascadia Code, Consolas, sans-serif;
            font-size: 13px;
            line-height: 1.5;
            overflow-x: hidden;
        }

        /* Top acrylic controls toolbar */
        #toolbar {
            position: sticky;
            top: 0;
            z-index: 100;
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            gap: 6px;
            padding: 8px 16px;
            background: var(--toolbar-bg);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border-bottom: 1px solid var(--border-color);
            font-size: 12px;
        }

        .btn-group {
            display: inline-flex;
            align-items: center;
            background: var(--bg-color);
            border: 1px solid var(--border-color);
            border-radius: 6px;
            padding: 2px;
            gap: 2px;
            box-shadow: var(--pill-shadow);
        }

        .btn {
            background: transparent;
            color: var(--text-color);
            border: none;
            border-radius: 4px;
            padding: 4px 8px;
            font-size: 11px;
            cursor: pointer;
            font-weight: 500;
            display: inline-flex;
            align-items: center;
            gap: 4px;
            transition: all 0.15s ease;
            white-space: nowrap;
        }

        .btn:hover {
            background: var(--hover-bg);
            color: var(--key-color);
        }

        /* Delightful modern search box */
        .search-box-wrapper {
            flex: 1;
            min-width: 240px;
            max-width: 440px;
            display: inline-flex;
            align-items: center;
            background: var(--input-bg);
            border: 1px solid var(--border-color);
            border-radius: 20px;
            padding: 2px 10px;
            gap: 6px;
            box-shadow: var(--pill-shadow);
            transition: border-color 0.2s, box-shadow 0.2s;
        }

        .search-box-wrapper:focus-within {
            border-color: var(--key-color);
            box-shadow: 0 0 0 2px rgba(9, 105, 218, 0.2);
        }

        .search-icon {
            font-size: 12px;
            opacity: 0.65;
            user-select: none;
        }

        #filterInput {
            flex: 1;
            background: transparent;
            color: var(--text-color);
            border: none;
            outline: none;
            font-size: 11.5px;
            padding: 3px 0;
            font-family: inherit;
        }

        .match-badge {
            font-size: 10px;
            background: var(--badge-bg);
            color: var(--badge-text);
            padding: 1px 6px;
            border-radius: 10px;
            font-weight: 600;
            user-select: none;
            white-space: nowrap;
        }

        .search-nav-btn, .search-clear-btn {
            background: transparent;
            border: none;
            color: var(--badge-text);
            cursor: pointer;
            padding: 2px 4px;
            border-radius: 3px;
            font-size: 10px;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            transition: all 0.15s ease;
        }

        .search-nav-btn:hover, .search-clear-btn:hover {
            color: var(--key-color);
            background: var(--hover-bg);
        }

        #statsBadge {
            margin-left: auto;
            color: var(--badge-text);
            font-size: 11px;
            font-weight: 500;
            padding: 3px 8px;
            border-radius: 12px;
            background: var(--badge-bg);
            user-select: none;
        }

        #copiedToast {
            position: fixed;
            bottom: 24px;
            right: 24px;
            background: #10b981;
            color: #ffffff;
            padding: 7px 16px;
            border-radius: 8px;
            font-size: 12px;
            font-weight: 600;
            box-shadow: 0 6px 16px rgba(0,0,0,0.2);
            opacity: 0;
            transform: translateY(10px);
            transition: all 0.2s cubic-bezier(0.16, 1, 0.3, 1);
            pointer-events: none;
            z-index: 999;
        }

        #copiedToast.visible {
            opacity: 1;
            transform: translateY(0);
        }

        /* Tree Container */
        #treeContainer {
            padding: 16px 20px 48px 20px;
            overflow-x: auto;
        }

        .tree-node {
            display: flex;
            flex-direction: column;
            margin: 2px 0;
        }

        .node-row {
            display: inline-flex;
            align-items: center;
            padding: 3px 8px;
            border-radius: 5px;
            cursor: pointer;
            width: fit-content;
            max-width: 100%;
            transition: background-color 0.12s ease;
        }

        .node-row:hover {
            background-color: var(--hover-bg);
        }

        .chevron {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            width: 16px;
            height: 16px;
            font-size: 10px;
            color: var(--badge-text);
            transition: transform 0.15s ease;
            cursor: pointer;
            margin-right: 4px;
            user-select: none;
        }

        .chevron.collapsed {
            transform: rotate(-90deg);
        }

        .chevron.leaf {
            opacity: 0;
            cursor: default;
        }

        /* Beautiful modern type badges */
        .type-pill {
            display: inline-flex;
            align-items: center;
            padding: 1px 5px;
            font-size: 10px;
            font-weight: 700;
            margin-right: 6px;
            border-radius: 4px;
            user-select: none;
            letter-spacing: 0.3px;
        }

        .pill-string {
            background: rgba(16, 185, 129, 0.12);
            color: var(--string-color);
            border: 1px solid rgba(16, 185, 129, 0.28);
        }

        .pill-number {
            background: rgba(245, 158, 11, 0.12);
            color: var(--number-color);
            border: 1px solid rgba(245, 158, 11, 0.28);
        }

        .pill-boolean {
            background: rgba(139, 92, 246, 0.12);
            color: var(--boolean-color);
            border: 1px solid rgba(139, 92, 246, 0.28);
        }

        .pill-null {
            background: rgba(100, 116, 139, 0.12);
            color: var(--null-color);
            font-style: italic;
            border: 1px solid rgba(100, 116, 139, 0.28);
        }

        .pill-object {
            background: rgba(9, 105, 218, 0.12);
            color: var(--key-color);
            border: 1px solid rgba(9, 105, 218, 0.28);
        }

        .pill-array {
            background: rgba(236, 72, 153, 0.12);
            color: #ec4899;
            border: 1px solid rgba(236, 72, 153, 0.28);
        }

        .node-key {
            color: var(--key-color);
            font-weight: 600;
            margin-right: 4px;
        }

        .node-colon {
            color: var(--badge-text);
            margin-right: 6px;
        }

        .node-value.string { color: var(--string-color); word-break: break-all; }
        .node-value.number { color: var(--number-color); font-weight: 600; }
        .node-value.boolean { color: var(--boolean-color); font-weight: 600; }
        .node-value.null { color: var(--null-color); font-style: italic; font-weight: 600; }

        .summary-badge {
            font-size: 10px;
            background: var(--badge-bg);
            color: var(--badge-text);
            padding: 1px 7px;
            border-radius: 10px;
            margin-left: 6px;
            font-weight: 500;
            user-select: none;
        }

        .actions-pill {
            display: none;
            margin-left: 8px;
            gap: 4px;
        }

        .node-row:hover .actions-pill {
            display: inline-flex;
        }

        .mini-btn {
            font-size: 9px;
            background: var(--badge-bg);
            color: var(--badge-text);
            border: 1px solid var(--border-color);
            border-radius: 3px;
            padding: 1px 6px;
            cursor: pointer;
            transition: all 0.15s;
        }

        .mini-btn:hover {
            color: var(--key-color);
            border-color: var(--key-color);
        }

        .children-block {
            margin-left: 20px;
            border-left: 1px dashed var(--border-color);
            padding-left: 8px;
            display: flex;
            flex-direction: column;
        }

        .children-block.hidden {
            display: none;
        }

        /* Matching highlight styles */
        .match-highlight {
            background-color: var(--highlight-bg) !important;
            border-radius: 3px;
            padding: 1px 4px;
            box-shadow: 0 0 0 1px rgba(255, 152, 0, 0.4);
        }

        .match-active {
            background-color: var(--highlight-active) !important;
            color: var(--highlight-active-text) !important;
            border-radius: 3px;
            padding: 1px 4px;
            box-shadow: 0 0 8px rgba(255, 152, 0, 0.8);
            font-weight: 700;
        }
    </style>
</head>
<body data-theme="dark">

    <div id="toolbar">
        <!-- Tree View Expansion -->
        <div class="btn-group">
            <button class="btn" id="expandAllBtn" title="Expand All / توسيع كافة الفروع">
                <span>⊞</span> Expand All / توسيع
            </button>
            <button class="btn" id="collapseAllBtn" title="Collapse All / طي كافة الفروع">
                <span>⊟</span> Collapse All / طي
            </button>
        </div>

        <!-- Formatting & Productivity -->
        <div class="btn-group">
            <button class="btn" id="beautifyBtn" title="Format & Beautify (2 Spaces) / تنسيق وتجميل الكود">
                <span>✨</span> Format / تنسيق
            </button>
            <button class="btn" id="minifyBtn" title="Minify & Compact / ضغط وتصغير الكود">
                <span>⚡</span> Minify / ضغط
            </button>
            <button class="btn" id="toMdTableBtn" title="Convert Array to Markdown Table / تحويل لجدول ماركداون ونسخه">
                <span>📊</span> Table / جدول
            </button>
        </div>

        <!-- Export & Copy -->
        <div class="btn-group">
            <button class="btn" id="exportHtmlBtn" title="Export Offline HTML / تصدير كصفحة ويب مستقلة دون إنترنت">
                <span>💾</span> Export / تصدير
            </button>
            <button class="btn" id="copyRawBtn" title="Copy Full Raw JSON / نسخ المحتوى الخام كاملاً">
                <span>📋</span> Copy / نسخ
            </button>
        </div>

        <!-- Delightful Shared Search Box -->
        <div class="search-box-wrapper" title="بحث فوري أو استعلام JSONPath (Ctrl+F)">
            <span class="search-icon">🔍</span>
            <input type="text" id="filterInput" placeholder="بحث فوري أو مسار (e.g. $.store or text)..." />
            <span id="matchCounter" class="match-badge">0 results</span>
            <button id="prevMatchBtn" class="search-nav-btn" title="السابق / Previous match (Shift+Enter)">▲</button>
            <button id="nextMatchBtn" class="search-nav-btn" title="التالي / Next match (Enter)">▼</button>
            <button id="clearSearchBtn" class="search-clear-btn" title="مسح البحث / Clear search (Esc)">✕</button>
        </div>

        <span id="statsBadge">0 items</span>
    </div>

    <div id="treeContainer"></div>
    <div id="copiedToast">✓ Copied to clipboard!</div>

    <script>
        let rawData = null;
        let totalCount = 0;
        let matchingNodes = [];
        let activeMatchIndex = -1;

        function showToast(msg) {
            const toast = document.getElementById('copiedToast');
            toast.textContent = msg || "✓ Copied to clipboard!";
            toast.classList.add('visible');
            setTimeout(() => toast.classList.remove('visible'), 2000);
        }

        function copyText(text, label) {
            navigator.clipboard.writeText(text).then(() => {
                showToast(label ? `✓ Copied ${label} / تم النسخ` : "✓ Copied / تم النسخ!");
            });
        }

        function createNodeElement(key, value, path, depth) {
            const isObject = value !== null && typeof value === 'object' && !Array.isArray(value);
            const isArray = Array.isArray(value);
            const isContainer = isObject || isArray;

            const container = document.createElement('div');
            container.className = 'tree-node';

            const row = document.createElement('div');
            row.className = 'node-row';
            row.setAttribute('data-path', path);

            // Chevron
            const chevron = document.createElement('span');
            chevron.className = isContainer ? 'chevron' : 'chevron leaf';
            chevron.textContent = isContainer ? '▼' : '•';
            row.appendChild(chevron);

            // Refined Type Pill Badge
            const pill = document.createElement('span');
            if (isObject) {
                pill.className = 'type-pill pill-object';
                pill.textContent = '{ }';
                pill.title = 'Object / كائن';
            } else if (isArray) {
                pill.className = 'type-pill pill-array';
                pill.textContent = '[ ]';
                pill.title = 'Array / مصفوفة';
            } else if (typeof value === 'string') {
                pill.className = 'type-pill pill-string';
                pill.textContent = 'abc';
                pill.title = 'String / نص';
            } else if (typeof value === 'number') {
                pill.className = 'type-pill pill-number';
                pill.textContent = '123';
                pill.title = 'Number / رقم';
            } else if (typeof value === 'boolean') {
                pill.className = 'type-pill pill-boolean';
                pill.textContent = value ? '✓ true' : '✕ false';
                pill.title = 'Boolean / قيمة منطقية';
            } else {
                pill.className = 'type-pill pill-null';
                pill.textContent = '∅ null';
                pill.title = 'Null / فارغ';
            }
            row.appendChild(pill);

            // Key
            if (key !== '') {
                const keyElem = document.createElement('span');
                keyElem.className = 'node-key';
                keyElem.textContent = key;
                row.appendChild(keyElem);

                const colon = document.createElement('span');
                colon.className = 'node-colon';
                colon.textContent = ':';
                row.appendChild(colon);
            }

            // Value or Summary
            if (isContainer) {
                const count = isArray ? value.length : Object.keys(value).length;
                totalCount += count;
                const summary = document.createElement('span');
                summary.className = 'summary-badge';
                summary.textContent = isArray ? `[ ${count} items / عناصر ]` : `{ ${count} keys / مفاتيح }`;
                row.appendChild(summary);
            } else {
                totalCount++;
                const valElem = document.createElement('span');
                let valType = typeof value;
                if (value === null) valType = 'null';
                valElem.className = `node-value ${valType}`;
                valElem.textContent = valType === 'string' ? `"${value}"` : String(value);
                row.appendChild(valElem);
            }

            // Hover actions
            const actions = document.createElement('span');
            actions.className = 'actions-pill';

            const copyPathBtn = document.createElement('button');
            copyPathBtn.className = 'mini-btn';
            copyPathBtn.textContent = 'JSONPath';
            copyPathBtn.title = `Copy JSONPath: ${path}`;
            copyPathBtn.onclick = (e) => {
                e.stopPropagation();
                copyText(path, 'JSONPath');
            };
            actions.appendChild(copyPathBtn);

            const copyValBtn = document.createElement('button');
            copyValBtn.className = 'mini-btn';
            copyValBtn.textContent = 'Copy';
            copyValBtn.title = 'Copy value';
            copyValBtn.onclick = (e) => {
                e.stopPropagation();
                const copyPayload = isContainer ? JSON.stringify(value, null, 2) : String(value);
                copyText(copyPayload, 'Value');
            };
            actions.appendChild(copyValBtn);

            row.appendChild(actions);
            container.appendChild(row);

            if (isContainer) {
                const childrenBlock = document.createElement('div');
                childrenBlock.className = 'children-block';

                if (isArray) {
                    value.forEach((item, index) => {
                        const childPath = `${path}[${index}]`;
                        childrenBlock.appendChild(createNodeElement(String(index), item, childPath, depth + 1));
                    });
                } else {
                    Object.entries(value).forEach(([k, v]) => {
                        const childPath = path ? `${path}.${k}` : `$.${k}`;
                        childrenBlock.appendChild(createNodeElement(k, v, childPath, depth + 1));
                    });
                }

                container.appendChild(childrenBlock);

                row.onclick = (e) => {
                    e.stopPropagation();
                    const isCollapsed = childrenBlock.classList.toggle('hidden');
                    chevron.classList.toggle('collapsed', isCollapsed);
                };
            }

            return container;
        }

        function renderJsonTree(data) {
            const container = document.getElementById('treeContainer');
            container.innerHTML = '';
            totalCount = 0;
            matchingNodes = [];
            activeMatchIndex = -1;

            if (typeof data === 'string') {
                try {
                    rawData = JSON.parse(data);
                } catch (e) {
                    container.innerHTML = `<div style="color: #ef4444; padding: 24px; font-size: 14px; font-weight: 600;">⚠️ JSON Syntax Error / خطأ في صياغة الجيسون: ${e.message}</div>`;
                    document.getElementById('statsBadge').textContent = 'Error';
                    return;
                }
            } else {
                rawData = data;
            }

            const rootElement = createNodeElement('', rawData, '$', 0);
            container.appendChild(rootElement);

            document.getElementById('statsBadge').textContent = `${totalCount.toLocaleString()} items / عنصر`;
        }

        // Expand / Collapse
        document.getElementById('expandAllBtn').onclick = () => {
            document.querySelectorAll('.children-block').forEach(b => b.classList.remove('hidden'));
            document.querySelectorAll('.chevron').forEach(c => c.classList.remove('collapsed'));
        };

        document.getElementById('collapseAllBtn').onclick = () => {
            document.querySelectorAll('.children-block').forEach(b => b.classList.add('hidden'));
            document.querySelectorAll('.chevron').forEach(c => c.classList.add('collapsed'));
        };

        // Beautify & Minify
        document.getElementById('beautifyBtn').onclick = () => {
            if (!rawData) return;
            const pretty = JSON.stringify(rawData, null, 2);
            copyText(pretty, 'Formatted JSON (2 spaces)');
        };

        document.getElementById('minifyBtn').onclick = () => {
            if (!rawData) return;
            const min = JSON.stringify(rawData);
            copyText(min, 'Minified JSON');
        };

        // Markdown Table Generator
        document.getElementById('toMdTableBtn').onclick = () => {
            if (!rawData) return;
            let arr = Array.isArray(rawData) ? rawData : (typeof rawData === 'object' ? Object.values(rawData) : null);
            if (!arr || arr.length === 0 || typeof arr[0] !== 'object') {
                showToast("⚠️ Needs an array of objects to create table!");
                return;
            }

            const keys = Array.from(new Set(arr.flatMap(o => Object.keys(o || {}))));
            const header = `| ${keys.join(' | ')} |`;
            const separator = `| ${keys.map(() => '---').join(' | ')} |`;
            const rows = arr.map(row => `| ${keys.map(k => String(row[k] !== undefined ? row[k] : '')).join(' | ')} |`).join('\n');
            const mdTable = `${header}\n${separator}\n${rows}`;

            copyText(mdTable, 'Markdown Table');
        };

        // Copy Raw
        document.getElementById('copyRawBtn').onclick = () => {
            if (!rawData) return;
            copyText(JSON.stringify(rawData, null, 2), 'Full JSON');
        };

        // Export Standalone HTML
        document.getElementById('exportHtmlBtn').onclick = () => {
            if (!rawData) return;
            const currentTheme = document.body.getAttribute('data-theme') || 'dark';
            const pageClone = document.documentElement.cloneNode(true);

            const scriptTag = pageClone.querySelector('script');
            const dataScript = document.createElement('script');
            dataScript.textContent = `\nwindow.addEventListener('DOMContentLoaded', () => {\n    document.body.setAttribute('data-theme', '${currentTheme}');\n    renderJsonTree(${JSON.stringify(rawData)});\n});\n`;
            scriptTag.parentNode.insertBefore(dataScript, scriptTag);

            const htmlContent = "<!DOCTYPE html>\n" + pageClone.outerHTML;
            const blob = new Blob([htmlContent], { type: 'text/html;charset=utf-8' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = 'jmdreader_json_report.html';
            document.body.appendChild(a);
            a.click();
            document.body.removeChild(a);
            URL.revokeObjectURL(url);
            showToast("✓ Standalone HTML Exported / تم تصدير الصفحة!");
        };

        // Search & Match Navigation Logic
        function updateMatchCounter() {
            const counter = document.getElementById('matchCounter');
            if (matchingNodes.length === 0) {
                counter.textContent = document.getElementById('filterInput').value.trim() ? '0 results / لا نتائج' : '0 results';
            } else {
                counter.textContent = `${activeMatchIndex + 1} of ${matchingNodes.length} / ${activeMatchIndex + 1} من ${matchingNodes.length}`;
            }
        }

        function highlightActiveMatch() {
            document.querySelectorAll('.match-active').forEach(el => el.classList.remove('match-active'));
            if (activeMatchIndex >= 0 && activeMatchIndex < matchingNodes.length) {
                const targetRow = matchingNodes[activeMatchIndex];
                targetRow.classList.add('match-active');
                targetRow.scrollIntoView({ behavior: 'smooth', block: 'center' });
            }
            updateMatchCounter();
        }

        function cycleMatch(delta) {
            if (matchingNodes.length === 0) return;
            activeMatchIndex = (activeMatchIndex + delta + matchingNodes.length) % matchingNodes.length;
            highlightActiveMatch();
        }

        function performSearch(query) {
            const input = document.getElementById('filterInput');
            if (input.value !== query) input.value = query;

            matchingNodes = [];
            activeMatchIndex = -1;

            const trimmed = query.trim();
            const nodes = document.querySelectorAll('.tree-node');

            if (!trimmed) {
                nodes.forEach(n => {
                    n.style.display = '';
                    const r = n.querySelector('.node-row');
                    r?.classList.remove('match-highlight', 'match-active');
                });
                updateMatchCounter();
                return;
            }

            const isJsonPath = trimmed.startsWith('$');
            let pathRegex = null;

            if (isJsonPath) {
                try {
                    let regexStr = trimmed
                        .replace(/\./g, '\\.')
                        .replace(/\[\*\]/g, '\\[\\d+\\]')
                        .replace(/\\\.\\\./g, '.*\\.');
                    pathRegex = new RegExp(regexStr + '$', 'i');
                } catch {
                    pathRegex = null;
                }
            }

            const lowerQuery = trimmed.toLowerCase();

            nodes.forEach(n => {
                const row = n.querySelector('.node-row');
                if (!row) return;

                let match = false;
                if (isJsonPath && pathRegex) {
                    const nodePath = row.getAttribute('data-path') || '';
                    match = pathRegex.test(nodePath);
                } else {
                    const text = row.textContent?.toLowerCase() || '';
                    match = text.includes(lowerQuery);
                }

                n.style.display = match ? '' : 'none';
                row.classList.toggle('match-highlight', match);
                row.classList.remove('match-active');

                if (match) {
                    matchingNodes.push(row);
                    // Open ancestors
                    let parent = n.parentElement;
                    while (parent && parent.id !== 'treeContainer') {
                        if (parent.classList.contains('children-block')) {
                            parent.classList.remove('hidden');
                            parent.previousElementSibling?.querySelector('.chevron')?.classList.remove('collapsed');
                            parent.parentElement.style.display = '';
                        }
                        parent = parent.parentElement;
                    }
                }
            });

            if (matchingNodes.length > 0) {
                activeMatchIndex = 0;
                highlightActiveMatch();
            } else {
                updateMatchCounter();
            }
        }

        document.getElementById('filterInput').addEventListener('input', (e) => {
            performSearch(e.target.value);
        });

        document.getElementById('filterInput').addEventListener('keydown', (e) => {
            if (e.key === 'Enter') {
                e.preventDefault();
                cycleMatch(e.shiftKey ? -1 : 1);
            } else if (e.key === 'Escape') {
                document.getElementById('clearSearchBtn').click();
            }
        });

        document.getElementById('prevMatchBtn').onclick = () => cycleMatch(-1);
        document.getElementById('nextMatchBtn').onclick = () => cycleMatch(1);
        document.getElementById('clearSearchBtn').onclick = () => {
            document.getElementById('filterInput').value = '';
            performSearch('');
            document.getElementById('filterInput').focus();
        };

        // Bridge listener for messages from WinUI 3 C#
        window.chrome?.webview?.addEventListener('message', event => {
            const data = event.data;
            if (!data) return;

            if (data.type === 'setContent' || data.type === 'setJson') {
                renderJsonTree(data.json || data.content || "");
                window.chrome.webview.postMessage({ type: 'rendered', totalNodes: totalCount });
            } else if (data.type === 'setTheme') {
                document.body.setAttribute('data-theme', (data.theme || 'dark').toLowerCase());
            } else if (data.type === 'expandAll') {
                document.getElementById('expandAllBtn').click();
            } else if (data.type === 'collapseAll') {
                document.getElementById('collapseAllBtn').click();
            } else if (data.type === 'search' || data.type === 'filter') {
                performSearch(data.query || '');
            } else if (data.type === 'findNext') {
                cycleMatch(1);
            } else if (data.type === 'findPrevious') {
                cycleMatch(-1);
            }
        });
    </script>
</body>
</html>
