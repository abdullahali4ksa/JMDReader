<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JMDReader Interactive JSON Tree Viewer</title>
    <style>
        :root {
            --bg-color: #ffffff;
            --text-color: #1f2328;
            --border-color: #d0d7de;
            --toolbar-bg: rgba(246, 248, 250, 0.92);
            --badge-bg: #eaeef2;
            --badge-text: #57606a;
            --hover-bg: rgba(0, 0, 0, 0.04);
            --key-color: #0969da;
            --string-color: #0a8543;
            --number-color: #953800;
            --boolean-color: #8250df;
            --null-color: #6e7781;
            --highlight-bg: #fff8c5;
            --highlight-active: #ff9800;
            --highlight-active-text: #ffffff;
            --input-bg: #ffffff;
            --pill-shadow: 0 1px 2px rgba(0,0,0,0.06);
        }

        body[data-theme="dark"] {
            --bg-color: #0d1117;
            --text-color: #e6edf3;
            --border-color: #30363d;
            --toolbar-bg: rgba(22, 27, 34, 0.92);
            --badge-bg: #21262d;
            --badge-text: #8b949e;
            --hover-bg: rgba(255, 255, 255, 0.06);
            --key-color: #79c0ff;
            --string-color: #7ee787;
            --number-color: #ffa657;
            --boolean-color: #d2a8ff;
            --null-color: #8b949e;
            --highlight-bg: #383200;
            --highlight-active: #ff9800;
            --highlight-active-text: #000000;
            --input-bg: #0d1117;
            --pill-shadow: 0 1px 2px rgba(0,0,0,0.3);
        }

        body[data-theme="darkslate"], body[data-theme="dark_slate"] {
            --bg-color: #1e2227;
            --text-color: #abb2bf;
            --border-color: #282c34;
            --toolbar-bg: rgba(33, 37, 43, 0.92);
            --badge-bg: #282c34;
            --badge-text: #828997;
            --hover-bg: rgba(255, 255, 255, 0.05);
            --key-color: #61afef;
            --string-color: #98c379;
            --number-color: #d19a66;
            --boolean-color: #c678dd;
            --null-color: #5c6370;
            --highlight-bg: #3e4451;
            --highlight-active: #e5c07b;
            --highlight-active-text: #1e2227;
            --input-bg: #1e2227;
            --pill-shadow: 0 1px 2px rgba(0,0,0,0.3);
        }

        body[data-theme="sepia"] {
            --bg-color: #fbf0d9;
            --text-color: #433422;
            --border-color: #e2d3b5;
            --toolbar-bg: rgba(243, 229, 200, 0.92);
            --badge-bg: #ebdac0;
            --badge-text: #6b583f;
            --hover-bg: rgba(100, 70, 30, 0.07);
            --key-color: #2b6cb0;
            --string-color: #2e7d32;
            --number-color: #d97706;
            --boolean-color: #7c3aed;
            --null-color: #78716c;
            --highlight-bg: #fef08a;
            --highlight-active: #ea580c;
            --highlight-active-text: #ffffff;
            --input-bg: #fbf0d9;
            --pill-shadow: 0 1px 2px rgba(0,0,0,0.06);
        }

        * {
            box-sizing: border-box;
            user-select: text;
            -webkit-user-select: text;
        }

        body {
            margin: 0;
            padding: 0;
            background-color: var(--bg-color);
            color: var(--text-color);
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI Variable", "Segoe UI", Cascadia Code, Consolas, sans-serif;
            font-size: 13px;
            line-height: 1.5;
            overflow-x: hidden;
        }

        /* Top acrylic controls toolbar */
        #toolbar {
            position: sticky;
            top: 0;
            z-index: 100;
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            gap: 6px;
            padding: 8px 16px;
            background: var(--toolbar-bg);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border-bottom: 1px solid var(--border-color);
            font-size: 12px;
        }

        .btn-group {
            display: inline-flex;
            align-items: center;
            background: var(--bg-color);
            border: 1px solid var(--border-color);
            border-radius: 6px;
            padding: 2px;
            gap: 2px;
            box-shadow: var(--pill-shadow);
        }

        .btn {
            background: transparent;
            color: var(--text-color);
            border: none;
            border-radius: 4px;
            padding: 4px 8px;
            font-size: 11px;
            cursor: pointer;
            font-weight: 500;
            display: inline-flex;
            align-items: center;
            gap: 4px;
            transition: all 0.15s ease;
            white-space: nowrap;
        }

        .btn:hover {
            background: var(--hover-bg);
            color: var(--key-color);
        }

        /* Delightful modern search box */
        .search-box-wrapper {
            flex: 1;
            min-width: 240px;
            max-width: 440px;
            display: inline-flex;
            align-items: center;
            background: var(--input-bg);
            border: 1px solid var(--border-color);
            border-radius: 20px;
            padding: 2px 10px;
            gap: 6px;
            box-shadow: var(--pill-shadow);
            transition: border-color 0.2s, box-shadow 0.2s;
        }

        .search-box-wrapper:focus-within {
            border-color: var(--key-color);
            box-shadow: 0 0 0 2px rgba(9, 105, 218, 0.2);
        }

        .search-icon {
            font-size: 12px;
            opacity: 0.65;
            user-select: none;
        }

        #filterInput {
            flex: 1;
            background: transparent;
            color: var(--text-color);
            border: none;
            outline: none;
            font-size: 11.5px;
            padding: 3px 0;
            font-family: inherit;
        }

        .match-badge {
            font-size: 10px;
            background: var(--badge-bg);
            color: var(--badge-text);
            padding: 1px 6px;
            border-radius: 10px;
            font-weight: 600;
            user-select: none;
            white-space: nowrap;
        }

        .search-nav-btn, .search-clear-btn {
            background: transparent;
            border: none;
            color: var(--badge-text);
            cursor: pointer;
            padding: 2px 4px;
            border-radius: 3px;
            font-size: 10px;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            transition: all 0.15s ease;
        }

        .search-nav-btn:hover, .search-clear-btn:hover {
            color: var(--key-color);
            background: var(--hover-bg);
        }

        #statsBadge {
            margin-left: auto;
            color: var(--badge-text);
            font-size: 11px;
            font-weight: 500;
            padding: 3px 8px;
            border-radius: 12px;
            background: var(--badge-bg);
            user-select: none;
        }

        #copiedToast {
            position: fixed;
            bottom: 24px;
            right: 24px;
            background: #10b981;
            color: #ffffff;
            padding: 7px 16px;
            border-radius: 8px;
            font-size: 12px;
            font-weight: 600;
            box-shadow: 0 6px 16px rgba(0,0,0,0.2);
            opacity: 0;
            transform: translateY(10px);
            transition: all 0.2s cubic-bezier(0.16, 1, 0.3, 1);
            pointer-events: none;
            z-index: 999;
        }

        #copiedToast.visible {
            opacity: 1;
            transform: translateY(0);
        }

        /* Tree Container */
        #treeContainer {
            padding: 16px 20px 48px 20px;
            overflow-x: auto;
        }

        .tree-node {
            display: flex;
            flex-direction: column;
            margin: 2px 0;
        }

        .node-row {
            display: inline-flex;
            align-items: center;
            padding: 3px 8px;
            border-radius: 5px;
            cursor: pointer;
            width: fit-content;
            max-width: 100%;
            transition: background-color 0.12s ease;
        }

        .node-row:hover {
            background-color: var(--hover-bg);
        }

        .chevron {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            width: 16px;
            height: 16px;
            font-size: 10px;
            color: var(--badge-text);
            transition: transform 0.15s ease;
            cursor: pointer;
            margin-right: 4px;
            user-select: none;
        }

        .chevron.collapsed {
            transform: rotate(-90deg);
        }

        .chevron.leaf {
            opacity: 0;
            cursor: default;
        }

        /* Beautiful modern type badges */
        .type-pill {
            display: inline-flex;
            align-items: center;
            padding: 1px 5px;
            font-size: 10px;
            font-weight: 700;
            margin-right: 6px;
            border-radius: 4px;
            user-select: none;
            letter-spacing: 0.3px;
        }

        .pill-string {
            background: rgba(16, 185, 129, 0.12);
            color: var(--string-color);
            border: 1px solid rgba(16, 185, 129, 0.28);
        }

        .pill-number {
            background: rgba(245, 158, 11, 0.12);
            color: var(--number-color);
            border: 1px solid rgba(245, 158, 11, 0.28);
        }

        .pill-boolean {
            background: rgba(139, 92, 246, 0.12);
            color: var(--boolean-color);
            border: 1px solid rgba(139, 92, 246, 0.28);
        }

        .pill-null {
            background: rgba(100, 116, 139, 0.12);
            color: var(--null-color);
            font-style: italic;
            border: 1px solid rgba(100, 116, 139, 0.28);
        }

        .pill-object {
            background: rgba(9, 105, 218, 0.12);
            color: var(--key-color);
            border: 1px solid rgba(9, 105, 218, 0.28);
        }

        .pill-array {
            background: rgba(236, 72, 153, 0.12);
            color: #ec4899;
            border: 1px solid rgba(236, 72, 153, 0.28);
        }

        .node-key {
            color: var(--key-color);
            font-weight: 600;
            margin-right: 4px;
        }

        .node-colon {
            color: var(--badge-text);
            margin-right: 6px;
        }

        .node-value.string { color: var(--string-color); word-break: break-all; }
        .node-value.number { color: var(--number-color); font-weight: 600; }
        .node-value.boolean { color: var(--boolean-color); font-weight: 600; }
        .node-value.null { color: var(--null-color); font-style: italic; font-weight: 600; }

        .summary-badge {
            font-size: 10px;
            background: var(--badge-bg);
            color: var(--badge-text);
            padding: 1px 7px;
            border-radius: 10px;
            margin-left: 6px;
            font-weight: 500;
            user-select: none;
        }

        .actions-pill {
            display: none;
            margin-left: 8px;
            gap: 4px;
        }

        .node-row:hover .actions-pill {
            display: inline-flex;
        }

        .mini-btn {
            font-size: 9px;
            background: var(--badge-bg);
            color: var(--badge-text);
            border: 1px solid var(--border-color);
            border-radius: 3px;
            padding: 1px 6px;
            cursor: pointer;
            transition: all 0.15s;
        }

        .mini-btn:hover {
            color: var(--key-color);
            border-color: var(--key-color);
        }

        .children-block {
            margin-left: 20px;
            border-left: 1px dashed var(--border-color);
            padding-left: 8px;
            display: flex;
            flex-direction: column;
        }

        .children-block.hidden {
            display: none;
        }

        /* Matching highlight styles */
        .match-highlight {
            background-color: var(--highlight-bg) !important;
            border-radius: 3px;
            padding: 1px 4px;
            box-shadow: 0 0 0 1px rgba(255, 152, 0, 0.4);
        }

        .match-active {
            background-color: var(--highlight-active) !important;
            color: var(--highlight-active-text) !important;
            border-radius: 3px;
            padding: 1px 4px;
            box-shadow: 0 0 8px rgba(255, 152, 0, 0.8);
            font-weight: 700;
        }
    </style>
</head>
<body data-theme="dark">

    <div id="toolbar">
        <!-- Tree View Expansion -->
        <div class="btn-group">
            <button class="btn" id="expandAllBtn" title="Expand All">
                <span>⊞</span> <span id="lblExpand">توسيع الكل</span>
            </button>
            <button class="btn" id="collapseAllBtn" title="Collapse All">
                <span>⊟</span> <span id="lblCollapse">طي الكل</span>
            </button>
        </div>

        <!-- Formatting & Productivity -->
        <div class="btn-group">
            <button class="btn" id="beautifyBtn" title="Format">
                <span>✨</span> <span id="lblFormat">تنسيق</span>
            </button>
            <button class="btn" id="minifyBtn" title="Minify">
                <span>⚡</span> <span id="lblMinify">ضغط</span>
            </button>
            <button class="btn" id="toMdTableBtn" title="Markdown Table">
                <span>📊</span> <span id="lblTable">جدول</span>
            </button>
        </div>

        <!-- Export & Copy -->
        <div class="btn-group">
            <button class="btn" id="exportHtmlBtn" title="Export HTML">
                <span>💾</span> <span id="lblExport">تصدير</span>
            </button>
            <button class="btn" id="copyRawBtn" title="Copy Raw">
                <span>📋</span> <span id="lblCopy">نسخ</span>
            </button>
        </div>

        <!-- Delightful Shared Search Box -->
        <div class="search-box-wrapper" title="Search (Ctrl+F)">
            <span class="search-icon">🔍</span>
            <input type="text" id="filterInput" placeholder="بحث فوري أو مسار JSONPath (Ctrl+F)..." />
            <span id="matchCounter" class="match-badge">0</span>
            <button id="prevMatchBtn" class="search-nav-btn" title="Previous (Shift+Enter)">▲</button>
            <button id="nextMatchBtn" class="search-nav-btn" title="Next (Enter)">▼</button>
            <button id="clearSearchBtn" class="search-clear-btn" title="Clear (Esc)">✕</button>
        </div>

        <span id="statsBadge">0</span>
    </div>

    <div id="treeContainer"></div>
    <div id="copiedToast">✓ Copied to clipboard!</div>

    <script>

        const I18N = {
            ar: {
                expand: "توسيع الكل", collapse: "طي الكل", format: "تنسيق", minify: "ضغط", table: "جدول", export: "تصدير", copy: "نسخ",
                searchPlaceholder: "بحث فوري أو مسار JSONPath (Ctrl+F)...",
                copied: "✓ تم النسخ إلى الحافظة!", copiedTarget: (t) => `✓ تم نسخ ${t}`,
                items: "عناصر", keys: "مفاتيح",
                typeObj: "كائن", typeArr: "مصفوفة", typeStr: "نص", typeNum: "رقم", typeBool: "قيمة منطقية", typeNull: "فارغ",
                statsItems: (n) => `${n} عنصر`, results: "مطابقة"
            },
            en: {
                expand: "Expand All", collapse: "Collapse All", format: "Format", minify: "Minify", table: "Table", export: "Export", copy: "Copy",
                searchPlaceholder: "Quick search or JSONPath (Ctrl+F)...",
                copied: "✓ Copied to clipboard!", copiedTarget: (t) => `✓ Copied ${t}`,
                items: "items", keys: "keys",
                typeObj: "Object", typeArr: "Array", typeStr: "String", typeNum: "Number", typeBool: "Boolean", typeNull: "Null",
                statsItems: (n) => `${n} items`, results: "results"
            },
            es: {
                expand: "Expandir todo", collapse: "Contraer todo", format: "Formatear", minify: "Comprimir", table: "Tabla", export: "Exportar", copy: "Copiar",
                searchPlaceholder: "Búsqueda rápida o JSONPath (Ctrl+F)...",
                copied: "✓ ¡Copiado al portapapeles!", copiedTarget: (t) => `✓ Copiado ${t}`,
                items: "elementos", keys: "claves",
                typeObj: "Objeto", typeArr: "Matriz", typeStr: "Cadena", typeNum: "Número", typeBool: "Booleano", typeNull: "Nulo",
                statsItems: (n) => `${n} elementos`, results: "resultados"
            },
            hi: {
                expand: "सभी विस्तृत करें", collapse: "सभी संकुचित करें", format: "प्रारूपित करें", minify: "छोटा करें", table: "तालिका", export: "निर्यात करें", copy: "कॉपी करें",
                searchPlaceholder: "त्वरित खोज या JSONPath (Ctrl+F)...",
                copied: "✓ क्लिपबोर्ड पर कॉपी किया गया!", copiedTarget: (t) => `✓ कॉपी किया गया ${t}`,
                items: "आइटम", keys: "कुंजियाँ",
                typeObj: "ऑब्जेक्ट", typeArr: "सरणी", typeStr: "स्ट्रिंग", typeNum: "संख्या", typeBool: "बूलियन", typeNull: "रिक्त",
                statsItems: (n) => `${n} आइटम`, results: "परिणाम"
            },
            zh: {
                expand: "全部展开", collapse: "全部折叠", format: "美化格式", minify: "压缩单行", table: "转为表格", export: "导出网页", copy: "复制内容",
                searchPlaceholder: "快速搜索或 JSONPath (Ctrl+F)...",
                copied: "✓ 已复制到剪贴板！", copiedTarget: (t) => `✓ 已复制 ${t}`,
                items: "项", keys: "键",
                typeObj: "对象", typeArr: "数组", typeStr: "字符串", typeNum: "数字", typeBool: "布尔值", typeNull: "空值",
                statsItems: (n) => `${n} 项`, results: "条结果"
            },
            fr: {
                expand: "Tout développer", collapse: "Tout réduire", format: "Formater", minify: "Compresser", table: "Tableau", export: "Exporter", copy: "Copier",
                searchPlaceholder: "Recherche rapide ou JSONPath (Ctrl+F)...",
                copied: "✓ Copié dans le presse-papiers !", copiedTarget: (t) => `✓ Copié ${t}`,
                items: "éléments", keys: "clés",
                typeObj: "Objet", typeArr: "Tableau", typeStr: "Chaîne", typeNum: "Nombre", typeBool: "Booléen", typeNull: "Nul",
                statsItems: (n) => `${n} éléments`, results: "résultats"
            },
            de: {
                expand: "Alle erweitern", collapse: "Alle einklappen", format: "Formatieren", minify: "Komprimieren", table: "Tabelle", export: "Exportieren", copy: "Kopieren",
                searchPlaceholder: "Schnellsuche oder JSONPath (Ctrl+F)...",
                copied: "✓ In Zwischenablage kopiert!", copiedTarget: (t) => `✓ ${t} kopiert`,
                items: "Elemente", keys: "Schlüssel",
                typeObj: "Objekt", typeArr: "Array", typeStr: "Zeichenkette", typeNum: "Zahl", typeBool: "Boolesch", typeNull: "Null",
                statsItems: (n) => `${n} Elemente`, results: "Ergebnisse"
            },
            ru: {
                expand: "Развернуть все", collapse: "Свернуть все", format: "Форматировать", minify: "Сжать", table: "Таблица", export: "Экспорт", copy: "Копировать",
                searchPlaceholder: "Быстрый поиск или JSONPath (Ctrl+F)...",
                copied: "✓ Скопировано в буфер обмена!", copiedTarget: (t) => `✓ Скопировано: ${t}`,
                items: "элементов", keys: "ключей",
                typeObj: "Объект", typeArr: "Массив", typeStr: "Строка", typeNum: "Число", typeBool: "Логическое", typeNull: "Null",
                statsItems: (n) => `${n} элементов`, results: "совпадений"
            },
            ja: {
                expand: "すべて展開", collapse: "すべて折りたたむ", format: "整形", minify: "圧縮", table: "表に変換", export: "エクスポート", copy: "コピー",
                searchPlaceholder: "クイック検索または JSONPath (Ctrl+F)...",
                copied: "✓ クリップボードにコピーしました！", copiedTarget: (t) => `✓ ${t} をコピーしました`,
                items: "項目", keys: "キー",
                typeObj: "オブジェクト", typeArr: "配列", typeStr: "文字列", typeNum: "数値", typeBool: "真偽値", typeNull: "Null",
                statsItems: (n) => `${n} 項目`, results: "件"
            },
            pt: {
                expand: "Expandir tudo", collapse: "Recolher tudo", format: "Formatar", minify: "Compactar", table: "Tabela", export: "Exportar", copy: "Copiar",
                searchPlaceholder: "Busca rápida ou JSONPath (Ctrl+F)...",
                copied: "✓ Copiado para a área de transferência!", copiedTarget: (t) => `✓ Copiado ${t}`,
                items: "itens", keys: "chaves",
                typeObj: "Objeto", typeArr: "Matriz", typeStr: "Texto", typeNum: "Número", typeBool: "Booleano", typeNull: "Nulo",
                statsItems: (n) => `${n} itens`, results: "resultados"
            }
        };

        let currentLang = "ar";

        function getI18n() {
            return I18N[currentLang] || I18N["en"];
        }

        function applyLanguage(lang) {
            if (!I18N[lang]) lang = "en";
            currentLang = lang;
            const t = getI18n();
            const elExp = document.getElementById('lblExpand'); if (elExp) elExp.textContent = t.expand;
            const elCol = document.getElementById('lblCollapse'); if (elCol) elCol.textContent = t.collapse;
            const elFmt = document.getElementById('lblFormat'); if (elFmt) elFmt.textContent = t.format;
            const elMin = document.getElementById('lblMinify'); if (elMin) elMin.textContent = t.minify;
            const elTbl = document.getElementById('lblTable'); if (elTbl) elTbl.textContent = t.table;
            const elExp2 = document.getElementById('lblExport'); if (elExp2) elExp2.textContent = t.export;
            const elCpy = document.getElementById('lblCopy'); if (elCpy) elCpy.textContent = t.copy;
            const elInp = document.getElementById('filterInput'); if (elInp) elInp.placeholder = t.searchPlaceholder;
            const elStats = document.getElementById('statsBadge'); if (elStats) elStats.textContent = t.statsItems(totalCount);
        }

        let rawData = null;
        let totalCount = 0;
        let matchingNodes = [];
        let activeMatchIndex = -1;

        function showToast(msg) {
            const toast = document.getElementById('copiedToast');
            toast.textContent = msg || "✓ Copied to clipboard!";
            toast.classList.add('visible');
            setTimeout(() => toast.classList.remove('visible'), 2000);
        }

        function copyText(text, label) {
            const t = getI18n();
            navigator.clipboard.writeText(text).then(() => {
                showToast(label ? t.copiedTarget(label) : t.copied);
            });
        });
        }

        function createNodeElement(key, value, path, depth) {
            const isObject = value !== null && typeof value === 'object' && !Array.isArray(value);
            const isArray = Array.isArray(value);
            const isContainer = isObject || isArray;

            const container = document.createElement('div');
            container.className = 'tree-node';

            const row = document.createElement('div');
            row.className = 'node-row';
            row.setAttribute('data-path', path);

            // Chevron
            const chevron = document.createElement('span');
            chevron.className = isContainer ? 'chevron' : 'chevron leaf';
            chevron.textContent = isContainer ? '▼' : '•';
            row.appendChild(chevron);

            // Refined Type Pill Badge (Pure i18n)
            const t = getI18n();
            const pill = document.createElement('span');
            if (isObject) {
                pill.className = 'type-pill pill-object';
                pill.textContent = '{ }';
                pill.title = t.typeObj;
            } else if (isArray) {
                pill.className = 'type-pill pill-array';
                pill.textContent = '[ ]';
                pill.title = t.typeArr;
            } else if (typeof value === 'string') {
                pill.className = 'type-pill pill-string';
                pill.textContent = 'abc';
                pill.title = t.typeStr;
            } else if (typeof value === 'number') {
                pill.className = 'type-pill pill-number';
                pill.textContent = '123';
                pill.title = t.typeNum;
            } else if (typeof value === 'boolean') {
                pill.className = 'type-pill pill-boolean';
                pill.textContent = value ? '✓ true' : '✕ false';
                pill.title = t.typeBool;
            } else {
                pill.className = 'type-pill pill-null';
                pill.textContent = '∅ null';
                pill.title = t.typeNull;
            }
            row.appendChild(pill);

            // Key
            if (key !== '') {
                const keyElem = document.createElement('span');
                keyElem.className = 'node-key';
                keyElem.textContent = key;
                row.appendChild(keyElem);

                const colon = document.createElement('span');
                colon.className = 'node-colon';
                colon.textContent = ':';
                row.appendChild(colon);
            }

            // Value or Summary
            if (isContainer) {
                const count = isArray ? value.length : Object.keys(value).length;
                totalCount += count;
                const summary = document.createElement('span');
                summary.className = 'summary-badge';
                summary.textContent = isArray ? `[ ${count} ${t.items} ]` : `{ ${count} ${t.keys} }`;
                row.appendChild(summary);
            } else {
                totalCount++;
                const valElem = document.createElement('span');
                let valType = typeof value;
                if (value === null) valType = 'null';
                valElem.className = `node-value ${valType}`;
                valElem.textContent = valType === 'string' ? `"${value}"` : String(value);
                row.appendChild(valElem);
            }

            // Hover actions
            const actions = document.createElement('span');
            actions.className = 'actions-pill';

            const copyPathBtn = document.createElement('button');
            copyPathBtn.className = 'mini-btn';
            copyPathBtn.textContent = 'JSONPath';
            copyPathBtn.title = `Copy JSONPath: ${path}`;
            copyPathBtn.onclick = (e) => {
                e.stopPropagation();
                copyText(path, 'JSONPath');
            };
            actions.appendChild(copyPathBtn);

            const copyValBtn = document.createElement('button');
            copyValBtn.className = 'mini-btn';
            copyValBtn.textContent = 'Copy';
            copyValBtn.title = 'Copy value';
            copyValBtn.onclick = (e) => {
                e.stopPropagation();
                const copyPayload = isContainer ? JSON.stringify(value, null, 2) : String(value);
                copyText(copyPayload, 'Value');
            };
            actions.appendChild(copyValBtn);

            row.appendChild(actions);
            container.appendChild(row);

            if (isContainer) {
                const childrenBlock = document.createElement('div');
                childrenBlock.className = 'children-block';

                if (isArray) {
                    value.forEach((item, index) => {
                        const childPath = `${path}[${index}]`;
                        childrenBlock.appendChild(createNodeElement(String(index), item, childPath, depth + 1));
                    });
                } else {
                    Object.entries(value).forEach(([k, v]) => {
                        const childPath = path ? `${path}.${k}` : `$.${k}`;
                        childrenBlock.appendChild(createNodeElement(k, v, childPath, depth + 1));
                    });
                }

                container.appendChild(childrenBlock);

                row.onclick = (e) => {
                    e.stopPropagation();
                    const isCollapsed = childrenBlock.classList.toggle('hidden');
                    chevron.classList.toggle('collapsed', isCollapsed);
                };
            }

            return container;
        }

        function renderJsonTree(data) {
            const container = document.getElementById('treeContainer');
            container.innerHTML = '';
            totalCount = 0;
            matchingNodes = [];
            activeMatchIndex = -1;

            if (typeof data === 'string') {
                try {
                    rawData = JSON.parse(data);
                } catch (e) {
                    container.innerHTML = `<div style="color: #ef4444; padding: 24px; font-size: 14px; font-weight: 600;">⚠️ JSON Syntax Error / خطأ في صياغة الجيسون: ${e.message}</div>`;
                    document.getElementById('statsBadge').textContent = 'Error';
                    return;
                }
            } else {
                rawData = data;
            }

            const rootElement = createNodeElement('', rawData, '$', 0);
            container.appendChild(rootElement);

            document.getElementById('statsBadge').textContent = `${totalCount.toLocaleString()} items / عنصر`;
        }

        // Expand / Collapse
        document.getElementById('expandAllBtn').onclick = () => {
            document.querySelectorAll('.children-block').forEach(b => b.classList.remove('hidden'));
            document.querySelectorAll('.chevron').forEach(c => c.classList.remove('collapsed'));
        };

        document.getElementById('collapseAllBtn').onclick = () => {
            document.querySelectorAll('.children-block').forEach(b => b.classList.add('hidden'));
            document.querySelectorAll('.chevron').forEach(c => c.classList.add('collapsed'));
        };

        // Beautify & Minify
        document.getElementById('beautifyBtn').onclick = () => {
            if (!rawData) return;
            const pretty = JSON.stringify(rawData, null, 2);
            copyText(pretty, 'Formatted JSON (2 spaces)');
        };

        document.getElementById('minifyBtn').onclick = () => {
            if (!rawData) return;
            const min = JSON.stringify(rawData);
            copyText(min, 'Minified JSON');
        };

        // Markdown Table Generator
        document.getElementById('toMdTableBtn').onclick = () => {
            if (!rawData) return;
            let arr = Array.isArray(rawData) ? rawData : (typeof rawData === 'object' ? Object.values(rawData) : null);
            if (!arr || arr.length === 0 || typeof arr[0] !== 'object') {
                showToast("⚠️ Needs an array of objects to create table!");
                return;
            }

            const keys = Array.from(new Set(arr.flatMap(o => Object.keys(o || {}))));
            const header = `| ${keys.join(' | ')} |`;
            const separator = `| ${keys.map(() => '---').join(' | ')} |`;
            const rows = arr.map(row => `| ${keys.map(k => String(row[k] !== undefined ? row[k] : '')).join(' | ')} |`).join('\n');
            const mdTable = `${header}\n${separator}\n${rows}`;

            copyText(mdTable, 'Markdown Table');
        };

        // Copy Raw
        document.getElementById('copyRawBtn').onclick = () => {
            if (!rawData) return;
            copyText(JSON.stringify(rawData, null, 2), 'Full JSON');
        };

        // Export Standalone HTML
        document.getElementById('exportHtmlBtn').onclick = () => {
            if (!rawData) return;
            const currentTheme = document.body.getAttribute('data-theme') || 'dark';
            const pageClone = document.documentElement.cloneNode(true);

            const scriptTag = pageClone.querySelector('script');
            const dataScript = document.createElement('script');
            dataScript.textContent = `\nwindow.addEventListener('DOMContentLoaded', () => {\n    document.body.setAttribute('data-theme', '${currentTheme}');\n    renderJsonTree(${JSON.stringify(rawData)});\n});\n`;
            scriptTag.parentNode.insertBefore(dataScript, scriptTag);

            const htmlContent = "<!DOCTYPE html>\n" + pageClone.outerHTML;
            const blob = new Blob([htmlContent], { type: 'text/html;charset=utf-8' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = 'jmdreader_json_report.html';
            document.body.appendChild(a);
            a.click();
            document.body.removeChild(a);
            URL.revokeObjectURL(url);
            showToast("✓ Standalone HTML Exported / تم تصدير الصفحة!");
        };

        // Search & Match Navigation Logic
        function updateMatchCounter() {
            const counter = document.getElementById('matchCounter');
            if (matchingNodes.length === 0) {
                counter.textContent = document.getElementById('filterInput').value.trim() ? '0 results / لا نتائج' : '0 results';
            } else {
                counter.textContent = `${activeMatchIndex + 1} of ${matchingNodes.length} / ${activeMatchIndex + 1} من ${matchingNodes.length}`;
            }
        }

        function highlightActiveMatch() {
            document.querySelectorAll('.match-active').forEach(el => el.classList.remove('match-active'));
            if (activeMatchIndex >= 0 && activeMatchIndex < matchingNodes.length) {
                const targetRow = matchingNodes[activeMatchIndex];
                targetRow.classList.add('match-active');
                targetRow.scrollIntoView({ behavior: 'smooth', block: 'center' });
            }
            updateMatchCounter();
        }

        function cycleMatch(delta) {
            if (matchingNodes.length === 0) return;
            activeMatchIndex = (activeMatchIndex + delta + matchingNodes.length) % matchingNodes.length;
            highlightActiveMatch();
        }

        function performSearch(query) {
            const input = document.getElementById('filterInput');
            if (input.value !== query) input.value = query;

            matchingNodes = [];
            activeMatchIndex = -1;

            const trimmed = query.trim();
            const nodes = document.querySelectorAll('.tree-node');

            if (!trimmed) {
                nodes.forEach(n => {
                    n.style.display = '';
                    const r = n.querySelector('.node-row');
                    r?.classList.remove('match-highlight', 'match-active');
                });
                updateMatchCounter();
                return;
            }

            const isJsonPath = trimmed.startsWith('$');
            let pathRegex = null;

            if (isJsonPath) {
                try {
                    let regexStr = trimmed
                        .replace(/\./g, '\\.')
                        .replace(/\[\*\]/g, '\\[\\d+\\]')
                        .replace(/\\\.\\\./g, '.*\\.');
                    pathRegex = new RegExp(regexStr + '$', 'i');
                } catch {
                    pathRegex = null;
                }
            }

            const lowerQuery = trimmed.toLowerCase();

            nodes.forEach(n => {
                const row = n.querySelector('.node-row');
                if (!row) return;

                let match = false;
                if (isJsonPath && pathRegex) {
                    const nodePath = row.getAttribute('data-path') || '';
                    match = pathRegex.test(nodePath);
                } else {
                    const text = row.textContent?.toLowerCase() || '';
                    match = text.includes(lowerQuery);
                }

                n.style.display = match ? '' : 'none';
                row.classList.toggle('match-highlight', match);
                row.classList.remove('match-active');

                if (match) {
                    matchingNodes.push(row);
                    // Open ancestors
                    let parent = n.parentElement;
                    while (parent && parent.id !== 'treeContainer') {
                        if (parent.classList.contains('children-block')) {
                            parent.classList.remove('hidden');
                            parent.previousElementSibling?.querySelector('.chevron')?.classList.remove('collapsed');
                            parent.parentElement.style.display = '';
                        }
                        parent = parent.parentElement;
                    }
                }
            });

            if (matchingNodes.length > 0) {
                activeMatchIndex = 0;
                highlightActiveMatch();
            } else {
                updateMatchCounter();
            }
        }

        document.getElementById('filterInput').addEventListener('input', (e) => {
            performSearch(e.target.value);
        });

        document.getElementById('filterInput').addEventListener('keydown', (e) => {
            if (e.key === 'Enter') {
                e.preventDefault();
                cycleMatch(e.shiftKey ? -1 : 1);
            } else if (e.key === 'Escape') {
                document.getElementById('clearSearchBtn').click();
            }
        });

        document.getElementById('prevMatchBtn').onclick = () => cycleMatch(-1);
        document.getElementById('nextMatchBtn').onclick = () => cycleMatch(1);
        document.getElementById('clearSearchBtn').onclick = () => {
            document.getElementById('filterInput').value = '';
            performSearch('');
            document.getElementById('filterInput').focus();
        };

        // Bridge listener for messages from WinUI 3 C#
        window.chrome?.webview?.addEventListener('message', event => {
            const data = event.data;
            if (!data) return;

            if (data.type === 'setLanguage') {
                applyLanguage(data.language || 'ar');
            } else if (data.type === 'setContent' || data.type === 'setJson') {
                if (data.language) applyLanguage(data.language);
                renderJsonTree(data.json || data.content || "");
                window.chrome.webview.postMessage({ type: 'rendered', totalNodes: totalCount });
            } else if (data.type === 'setTheme') {
                document.body.setAttribute('data-theme', (data.theme || 'dark').toLowerCase());
            } else if (data.type === 'expandAll') {
                document.getElementById('expandAllBtn').click();
            } else if (data.type === 'collapseAll') {
                document.getElementById('collapseAllBtn').click();
            } else if (data.type === 'search' || data.type === 'filter') {
                performSearch(data.query || '');
            } else if (data.type === 'findNext') {
                cycleMatch(1);
            } else if (data.type === 'findPrevious') {
                cycleMatch(-1);
            }
        });
    </script>
</body>
</html>
