ShortDescription: Modern Antigravity-grade Markdown Reader and Editor for Windows.
Description: >
  MDReader is a high-performance native Windows Markdown reader and editor built with WinUI 3
  and an offline WebView2 engine. Features tri-mode view (Split/Edit/Read), tri-theme styling
  (Light/Dark/Sepia), table of contents outline, F11 Zen focus mode, comments drawer,
  auto-scrolling, KaTeX math, Mermaid diagrams, and one-click PDF/HTML export.
