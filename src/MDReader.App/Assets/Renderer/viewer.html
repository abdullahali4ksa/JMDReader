<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MDReader Antigravity Viewer</title>
    <style>
        :root {
            --bg-color: #ffffff;
            --text-color: #1f2328;
            --border-color: #d0d7de;
            --code-bg: #f6f8fa;
            --link-color: #0969da;
            --table-row-odd: #f6f8fa;
            --alert-note-border: #0969da;
            --alert-note-bg: rgba(9, 105, 218, 0.08);
            --alert-tip-border: #1a7f37;
            --alert-tip-bg: rgba(26, 127, 55, 0.08);
            --alert-important-border: #8250df;
            --alert-important-bg: rgba(130, 80, 223, 0.08);
            --alert-warning-border: #9a6700;
            --alert-warning-bg: rgba(154, 103, 0, 0.08);
            --alert-caution-border: #cf222e;
            --alert-caution-bg: rgba(207, 34, 46, 0.08);
        }

        [data-theme="dark"] {
            --bg-color: #0d1117;
            --text-color: #e6edf3;
            --border-color: #30363d;
            --code-bg: #161b22;
            --link-color: #2f81f7;
            --table-row-odd: #161b22;
            --alert-note-border: #2f81f7;
            --alert-note-bg: rgba(56, 139, 253, 0.12);
            --alert-tip-border: #3fb950;
            --alert-tip-bg: rgba(46, 160, 67, 0.12);
            --alert-important-border: #a371f7;
            --alert-important-bg: rgba(163, 113, 247, 0.12);
            --alert-warning-border: #d29922;
            --alert-warning-bg: rgba(187, 128, 9, 0.12);
            --alert-caution-border: #f85149;
            --alert-caution-bg: rgba(248, 81, 73, 0.12);
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI Variable", "Segoe UI", Helvetica, Arial, sans-serif;
            font-size: 15px;
            line-height: 1.6;
            margin: 0;
            padding: 24px 32px;
            transition: background-color 0.2s, color 0.2s;
            word-wrap: break-word;
        }

        /* Bidirectional text support */
        .rtl { direction: rtl; text-align: right; font-family: "Segoe UI Variable", "Cairo", "Amiri", "Segoe UI", sans-serif; }
        .ltr { direction: ltr; text-align: left; }

        h1, h2, h3, h4, h5, h6 {
            margin-top: 24px;
            margin-bottom: 16px;
            font-weight: 600;
            line-height: 1.25;
            color: var(--text-color);
        }
        h1 { font-size: 2em; border-bottom: 1px solid var(--border-color); padding-bottom: 0.3em; }
        h2 { font-size: 1.5em; border-bottom: 1px solid var(--border-color); padding-bottom: 0.3em; }
        h3 { font-size: 1.25em; }

        p, blockquote, ul, ol, dl, table, pre { margin-top: 0; margin-bottom: 16px; }

        a { color: var(--link-color); text-decoration: none; }
        a:hover { text-decoration: underline; }

        hr { height: 1px; padding: 0; margin: 24px 0; background-color: var(--border-color); border: 0; }

        /* Blockquotes */
        blockquote {
            padding: 0 1em;
            color: var(--text-color);
            opacity: 0.85;
            border-left: 0.25em solid var(--border-color);
            margin: 0 0 16px 0;
        }

        /* Antigravity / GitHub Callout Alerts */
        .markdown-alert {
            padding: 12px 16px;
            margin-bottom: 16px;
            border-left: 4px solid;
            border-radius: 6px;
        }
        .markdown-alert .alert-title {
            display: flex;
            align-items: center;
            gap: 8px;
            font-weight: 600;
            margin-bottom: 6px;
            font-size: 14px;
        }
        .markdown-alert-note { border-color: var(--alert-note-border); background-color: var(--alert-note-bg); }
        .markdown-alert-note .alert-title { color: var(--alert-note-border); }
        .markdown-alert-tip { border-color: var(--alert-tip-border); background-color: var(--alert-tip-bg); }
        .markdown-alert-tip .alert-title { color: var(--alert-tip-border); }
        .markdown-alert-important { border-color: var(--alert-important-border); background-color: var(--alert-important-bg); }
        .markdown-alert-important .alert-title { color: var(--alert-important-border); }
        .markdown-alert-warning { border-color: var(--alert-warning-border); background-color: var(--alert-warning-bg); }
        .markdown-alert-warning .alert-title { color: var(--alert-warning-border); }
        .markdown-alert-caution { border-color: var(--alert-caution-border); background-color: var(--alert-caution-bg); }
        .markdown-alert-caution .alert-title { color: var(--alert-caution-border); }

        /* Tables */
        table { border-collapse: collapse; width: 100%; margin-bottom: 16px; display: block; overflow-x: auto; }
        th, td { padding: 8px 14px; border: 1px solid var(--border-color); }
        th { font-weight: 600; background-color: var(--code-bg); }
        tr:nth-child(2n) { background-color: var(--table-row-odd); }

        /* Code Blocks with Header and Copy Button */
        .code-block-container {
            position: relative;
            margin: 16px 0;
            border-radius: 6px;
            border: 1px solid var(--border-color);
            background-color: var(--code-bg);
            overflow: hidden;
            direction: ltr;
        }
        .code-block-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 6px 12px;
            background: rgba(0, 0, 0, 0.05);
            border-bottom: 1px solid var(--border-color);
            font-size: 12px;
            font-family: monospace;
            color: var(--text-color);
            opacity: 0.8;
        }
        .copy-button {
            background: transparent;
            border: 1px solid var(--border-color);
            border-radius: 4px;
            padding: 2px 8px;
            font-size: 11px;
            cursor: pointer;
            color: var(--text-color);
            display: flex;
            align-items: center;
            gap: 4px;
            transition: all 0.2s;
        }
        .copy-button:hover {
            background: rgba(127, 127, 127, 0.15);
        }
        pre {
            padding: 12px;
            margin: 0;
            overflow-x: auto;
            font-family: "Cascadia Code", Consolas, Monaco, monospace;
            font-size: 13px;
            line-height: 1.45;
        }
        code {
            font-family: "Cascadia Code", Consolas, Monaco, monospace;
            font-size: 85%;
            padding: 0.2em 0.4em;
            margin: 0;
            background-color: rgba(175, 184, 193, 0.2);
            border-radius: 4px;
        }
        pre code {
            padding: 0;
            background-color: transparent;
            font-size: 100%;
        }

        /* Math Styling (KaTeX-like) */
        .math-inline {
            font-family: "Cambria Math", "KaTeX_Math", serif;
            font-style: italic;
            padding: 0 4px;
        }
        .math-block {
            display: block;
            text-align: center;
            margin: 16px 0;
            padding: 12px;
            font-family: "Cambria Math", "KaTeX_Math", serif;
            font-size: 1.15em;
            overflow-x: auto;
        }

        /* Mermaid placeholder and rendered container */
        .mermaid-container {
            text-align: center;
            margin: 16px 0;
            padding: 16px;
            background: var(--code-bg);
            border: 1px solid var(--border-color);
            border-radius: 6px;
            overflow-x: auto;
        }

        /* Task Lists */
        ul.task-list { list-style: none; padding-left: 0; }
        .task-list-item input[type="checkbox"] { margin-right: 0.5em; vertical-align: middle; }
    </style>
</head>
<body data-theme="dark">
    <div id="content"></div>

    <script>
        // High-fidelity Markdown & Antigravity AST Parser
        const alertIcons = {
            note: 'ℹ️',
            tip: '💡',
            important: '📢',
            warning: '⚠️',
            caution: '🛑'
        };

        function isRtlText(text) {
            return /[\u0590-\u08FF\uFB50-\uFDFF\uFE70-\uFEFF]/.test(text);
        }

        function escapeHtml(text) {
            return text
                .replace(/&/g, "&amp;")
                .replace(/</g, "&lt;")
                .replace(/>/g, "&gt;")
                .replace(/"/g, "&quot;")
                .replace(/'/g, "&#039;");
        }

        function parseAntigravityMarkdown(md) {
            if (!md) return "";

            let lines = md.split(/\r?\n/);
            let html = [];
            let inCodeBlock = false;
            let codeLang = "";
            let codeLines = [];
            let inTable = false;
            let tableRows = [];

            for (let i = 0; i < lines.length; i++) {
                let line = lines[i];

                // Fenced Code Block
                if (line.trim().startsWith("```")) {
                    if (inCodeBlock) {
                        // Close code block
                        let fullCode = codeLines.join("\n");
                        if (codeLang.toLowerCase() === "mermaid") {
                            html.push(`<div class="mermaid-container"><strong>[Mermaid Diagram]</strong><pre class="mermaid">${escapeHtml(fullCode)}</pre></div>`);
                        } else {
                            html.push(`
                                <div class="code-block-container">
                                    <div class="code-block-header">
                                        <span>${escapeHtml(codeLang || "text")}</span>
                                        <button class="copy-button" onclick="copyCode(this)">📋 Copy</button>
                                    </div>
                                    <pre><code class="language-${escapeHtml(codeLang)}">${escapeHtml(fullCode)}</code></pre>
                                </div>
                            `);
                        }
                        inCodeBlock = false;
                        codeLines = [];
                        codeLang = "";
                        continue;
                    } else {
                        inCodeBlock = true;
                        codeLang = line.trim().substring(3).trim();
                        codeLines = [];
                        continue;
                    }
                }

                if (inCodeBlock) {
                    codeLines.push(line);
                    continue;
                }

                // GitHub Alert / Callout: > [!NOTE], > [!TIP], etc.
                let alertMatch = line.match(/^>\s*\[!(NOTE|TIP|IMPORTANT|WARNING|CAUTION)\]/i);
                if (alertMatch) {
                    let alertType = alertMatch[1].toLowerCase();
                    let alertBody = [];
                    while (i + 1 < lines.length && lines[i + 1].startsWith(">")) {
                        i++;
                        alertBody.push(lines[i].replace(/^>\s?/, ""));
                    }
                    let title = alertType.toUpperCase();
                    let icon = alertIcons[alertType] || 'ℹ️';
                    html.push(`
                        <div class="markdown-alert markdown-alert-${alertType}">
                            <div class="alert-title"><span>${icon}</span> <span>${title}</span></div>
                            <div>${parseInline(alertBody.join(" "))}</div>
                        </div>
                    `);
                    continue;
                }

                // Math Block $$ ... $$
                if (line.trim().startsWith("$$")) {
                    let mathLines = [line.trim().substring(2)];
                    if (!line.trim().endsWith("$$") || line.trim() === "$$") {
                        while (i + 1 < lines.length && !lines[i + 1].trim().endsWith("$$")) {
                            i++;
                            mathLines.push(lines[i]);
                        }
                        if (i + 1 < lines.length) {
                            i++;
                            mathLines.push(lines[i].trim().replace(/\$\$$/, ""));
                        }
                    } else {
                        mathLines = [line.trim().replace(/^\$\$|\$\$$/g, "")];
                    }
                    html.push(`<div class="math-block">$$ ${escapeHtml(mathLines.join(" "))} $$</div>`);
                    continue;
                }

                // Horizontal Rule
                if (/^(\*\*\*|---|___)$/.test(line.trim())) {
                    html.push("<hr />");
                    continue;
                }

                // Headings
                let headingMatch = line.match(/^(#{1,6})\s+(.*)$/);
                if (headingMatch) {
                    let level = headingMatch[1].length;
                    let text = headingMatch[2];
                    let dirClass = isRtlText(text) ? "rtl" : "ltr";
                    let id = text.toLowerCase().replace(/[^\w\s-]/g, '').trim().replace(/\s+/g, '-');
                    html.push(`<h${level} id="${id}" class="${dirClass}">${parseInline(text)}</h${level}>`);
                    continue;
                }

                // Table Rows
                if (line.trim().startsWith("|") && line.trim().endsWith("|")) {
                    // Check if separator
                    if (/^\|(\s*:?-+:?\s*\|)+$/.test(line.trim())) {
                        continue;
                    }
                    let cells = line.trim().slice(1, -1).split("|").map(c => c.trim());
                    if (!inTable) {
                        inTable = true;
                        html.push("<table><thead><tr>");
                        cells.forEach(c => html.push(`<th>${parseInline(c)}</th>`));
                        html.push("</tr></thead><tbody>");
                    } else {
                        html.push("<tr>");
                        cells.forEach(c => html.push(`<td>${parseInline(c)}</td>`));
                        html.push("</tr>");
                    }
                    continue;
                } else if (inTable) {
                    html.push("</tbody></table>");
                    inTable = false;
                }

                // List items and Task Lists
                let taskMatch = line.match(/^(\s*[-*+]\s+\[([ xX])\])\s+(.*)$/);
                if (taskMatch) {
                    let isChecked = taskMatch[2].toLowerCase() === "x";
                    html.push(`<div class="task-list-item"><input type="checkbox" ${isChecked ? "checked" : ""} disabled /> ${parseInline(taskMatch[3])}</div>`);
                    continue;
                }

                let listMatch = line.match(/^(\s*)([-*+]|\d+\.)\s+(.*)$/);
                if (listMatch) {
                    let dirClass = isRtlText(listMatch[3]) ? "rtl" : "ltr";
                    html.push(`<ul><li class="${dirClass}">${parseInline(listMatch[3])}</li></ul>`);
                    continue;
                }

                // Empty line
                if (line.trim() === "") {
                    continue;
                }

                // Normal Paragraph
                let dirClass = isRtlText(line) ? "rtl" : "ltr";
                html.push(`<p class="${dirClass}">${parseInline(line)}</p>`);
            }

            if (inTable) {
                html.push("</tbody></table>");
            }

            return html.join("\n");
        }

        function parseInline(text) {
            if (!text) return "";
            let res = escapeHtml(text);

            // Inline Math: $...$
            res = res.replace(/\$([^\$]+)\$/g, '<span class="math-inline">\\( $1 \\)</span>');

            // Bold & Italic
            res = res.replace(/\*\*\*(.*?)\*\*\*/g, '<strong><em>$1</em></strong>');
            res = res.replace(/\*\*(.*?)\*\*/g, '<strong>$1</strong>');
            res = res.replace(/\*(.*?)\*/g, '<em>$1</em>');
            res = res.replace(/~~(.*?)~~/g, '<del>$1</del>');

            // Inline Code
            res = res.replace(/`([^`]+)`/g, '<code>$1</code>');

            // Images: ![alt](url)
            res = res.replace(/!\[([^\]]*)\]\(([^)]+)\)/g, '<img src="$2" alt="$1" style="max-width: 100%; height: auto;" />');

            // Links: [text](url)
            res = res.replace(/\[([^\]]+)\]\(([^)]+)\)/g, '<a href="$2" onclick="handleLinkClick(event, \'$2\')">$1</a>');

            return res;
        }

        function handleLinkClick(e, url) {
            e.preventDefault();
            if (window.chrome && window.chrome.webview) {
                window.chrome.webview.postMessage({ type: 'linkClick', url: url });
            } else {
                window.open(url, '_blank');
            }
        }

        function copyCode(btn) {
            const container = btn.closest('.code-block-container');
            const codeEl = container.querySelector('code');
            const codeText = codeEl ? codeEl.innerText : "";
            navigator.clipboard.writeText(codeText).then(() => {
                const originalText = btn.innerHTML;
                btn.innerHTML = '✓ Copied!';
                btn.style.color = '#10b981';
                setTimeout(() => {
                    btn.innerHTML = originalText;
                    btn.style.color = '';
                }, 2000);
            });
        }

        // Bridge listener for messages from WinUI 3 C#
        window.chrome?.webview?.addEventListener('message', event => {
            const data = event.data;
            if (data.type === 'setContent') {
                const rendered = parseAntigravityMarkdown(data.markdown || "");
                document.getElementById('content').innerHTML = rendered;
                window.chrome.webview.postMessage({ type: 'rendered' });
            } else if (data.type === 'setTheme') {
                document.body.setAttribute('data-theme', data.theme === 'Light' ? 'light' : 'dark');
            } else if (data.type === 'setZoom') {
                document.body.style.zoom = data.zoom;
            }
        });
    </script>
</body>
</html>
